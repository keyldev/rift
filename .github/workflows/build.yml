name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      # A v1.2.3 tag builds version 1.2.3; other builds keep the version from Directory.Build.props.
      - name: Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION_ARG=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Rift.slnx

      - name: Build
        run: dotnet build Rift.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Rift.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      # Native AOT (PublishAot in Rift.App.csproj): Rift.exe plus Skia's and HarfBuzz's native DLLs.
      - name: Publish win-x64
        run: dotnet publish src/Rift.App -c Release -r win-x64 $env:VERSION_ARG -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: rift-win-x64
          path: |
            publish/win-x64
            !publish/win-x64/*.pdb
          if-no-files-found: error

      # Tags also make the installer. Velopack packs the AOT build into Rift-win-Setup.exe, a self-updating
      # portable zip and the packages installed copies update from; the previous release's package is
      # downloaded first so the update can ship as a small delta.
      - name: Package with Velopack
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" -o releases \
            || echo "No earlier release made with Velopack: full package only"
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --releaseNotes "$notes"; fi
          dotnet vpk pack --packId Rift --packVersion "${GITHUB_REF_NAME#v}" --packDir publish/win-x64 --mainExe Rift.exe \
            --packTitle Rift --packAuthors "Vasiliy Zalatov" --icon src/Rift.App/Assets/rift.ico \
            --shortcuts StartMenuRoot -o releases "$@"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: rift-releases
          path: releases
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rift-releases
          path: releases

      # Notes come from .github/release-notes/<tag>.md when it exists, otherwise GitHub writes them.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Everything Velopack made for this version: the setup, the portable zip, the full package and a delta,
        # and the feeds (releases.win.json, RELEASES) that installed copies read. Packages of older versions,
        # downloaded only to build the delta, stay on their own releases.
        run: |
          version="${GITHUB_REF_NAME#v}"
          files=$(find releases -maxdepth 1 -type f \( ! -name '*.nupkg' -o -name "*-$version-*.nupkg" \))
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" $files --title "Rift $version" --verify-tag "$@"
